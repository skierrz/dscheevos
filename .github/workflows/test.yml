name: Tests
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rcheevos
        run: git submodule update --init --depth 1 external/rcheevos
      - name: Core unit tests
        run: make -C dscheevos/core test
      - name: Session file layout matches mksession.py
        run: |
          cc -Idscheevos/module/include tools/mksession/layout.c -o layout
          ./layout | grep -q "^size=$(sed -n 's/^BOOT_SIZE = \([0-9]*\).*/\1/p' tools/mksession/mksession.py) "
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules
        run: git submodule update --init --depth 1 external/rcheevos tools/melonDS
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build p7zip-full
      - name: Cache test games
        uses: actions/cache@v4
        with:
          path: ~/dsc-roms
          key: dsc-roms-${{ hashFiles('tests/games/games.txt') }}
      - name: Fetch test games
        run: |
          make -C tools/rahash
          python3 tests/games/fetch_roms.py --hasher tools/rahash/rahash --out ~/dsc-roms
      - name: Build game test harness
        run: |
          cmake -S tests/games -B build/games -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/games
      - name: Game tests
        run: DSC_GAMETEST=build/games/dsc-gametest DSC_ROMS=$HOME/dsc-roms tests/games/run.sh
  module:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rcheevos
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 external/rcheevos
      - name: Build ARM9 module
        run: make -C dscheevos/module
      - name: Build module test
        run: make -C tests/module
      - uses: actions/upload-artifact@v4
        with:
          name: dscheevos9
          path: |
            dscheevos/module/build/dscheevos9.bin
            tests/module/out/module-test.nds
  launcher:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.24.0
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 external/rcheevos external/mbedtls
      - name: Build the launcher
        run: make -C dscheevos/launcher
      - uses: actions/upload-artifact@v4
        with:
          name: dscheevos-launcher
          path: dscheevos/launcher/dscheevos-launcher.nds
  chainload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch nds-bootloader
        run: git submodule update --init --depth 1 external/nds-bootloader
      - name: Build load.bin (devkitARM, libnds 2 / calico)
        run: docker run --rm -v "$PWD:/src" -w /src devkitpro/devkitarm:20260610 make -C dscheevos/launcher/loader
      - name: Build chainload test programs (BlocksDS)
        run: docker run --rm -v "$PWD:/src" -w /src skylyrac/blocksds:slim-v1.24.0 make -C tests/chainload
      - uses: actions/upload-artifact@v4
        with:
          name: chainload
          path: |
            dscheevos/launcher/loader/out/load.bin
            tests/chainload/out/*.nds
